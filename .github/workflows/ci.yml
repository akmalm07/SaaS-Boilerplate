name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - name: Check for committed secrets
        shell: bash
        run: |
          set +e
          rg --ignore-case --glob '!node_modules/**' --glob '!package-lock.json' --glob '!*.md' "(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{12,}" .
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "Potential credential-like value found in a tracked source file."
            exit 1
          fi
          if [ "$result" -ne 1 ]; then
            echo "Secret scan failed with ripgrep exit code $result."
            exit "$result"
          fi

  provider-integration:
    name: Read-only provider integration checks
    needs: generator
    # Live providers use repository secrets. Do not run this job for pull
    # requests, where secrets must remain unavailable to untrusted code.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_API_VERSION: 2026-06-24.dahlia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run test:providers

  backend-skeletons:
    name: ${{ matrix.backend }} starter build
    needs: generator
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: typescript
            database: postgres
            storage: local
            email: smtp
            build: npm install --no-audit --no-fund && npm run build && npm test
          - backend: python
            database: mongodb
            storage: aws-s3
            email: resend
            build: python -m pip install . && python -m compileall -q app
          - backend: go
            database: firestore
            storage: gcs
            email: twilio
            build: go mod tidy && go build ./cmd/api
          - backend: java
            database: neon
            storage: firebase-storage
            email: sendgrid
            build: mvn --batch-mode --no-transfer-progress package -DskipTests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24.x' }
      - run: npm ci
      - run: npm run build
      - name: Generate selected skeleton
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/dist/cli.js" generated-${{ matrix.backend }} --backend ${{ matrix.backend }} --frontend react --database ${{ matrix.database }} --storage ${{ matrix.storage }} --email ${{ matrix.email }} --billing --organizations
      - name: Build generated backend
        working-directory: ${{ runner.temp }}/generated-${{ matrix.backend }}/backend
        run: ${{ matrix.build }}
      - name: Build minimal React client
        working-directory: ${{ runner.temp }}/generated-${{ matrix.backend }}/frontend
        run: npm install --no-audit --no-fund && npm run build && npm test

  frontend-skeletons:
    name: ${{ matrix.frontend }} starter build
    needs: generator
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - frontend: angular
            build: npm install --no-audit --no-fund && npm run build
          - frontend: react-native
            build: npm install --no-audit --no-fund && npm run typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Generate frontend skeleton
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/dist/cli.js" generated-${{ matrix.frontend }} --backend typescript --frontend ${{ matrix.frontend }} --database postgres --storage local --email smtp
      - name: Build generated frontend
        working-directory: ${{ runner.temp }}/generated-${{ matrix.frontend }}/frontend
        run: ${{ matrix.build }}
